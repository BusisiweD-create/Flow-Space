services:
  - type: web
    name: deliverables-sprint-signoff-frontend
    env: static
    buildCommand: |
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 && ./flutter/bin/flutter pub get && ./flutter/bin/flutter build web --dart-define=API_BASE_URL=https://deliverables-sprint-signoff.onrender.com/api/v1
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_WEB_CANVASKIT_URL
        value: https://cdn.jsdelivr.net/gh/flutter/canvaskit@master
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: Expires
        value: 0
      - path: /*
        name: Build-Timestamp
        value: "$(date)"

  - type: web
    name: deliverables-sprint-signoff-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm install && node server.js
    envVars:
      - key: DB_CONNECTION_MODE
        value: external
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
